databaseChangeLog:
  # Select AI enablement for the Autonomous Database target.
  #
  # Profiles and agent tools are NOT created here. DBMS_CLOUD_AI.CREATE_PROFILE
  # and DBMS_CLOUD_AI_AGENT.CREATE_TOOL create objects owned by the invoking
  # user, and Liquibase connects as ADMIN — objects it created would be
  # invisible to PAF, which connects as AGENT_FACTORY. PAF creates both through
  # its own UI, as itself; this changelog grants it the privileges to do so.
  #
  # Oracle Database Free rejects a custom provider_endpoint pre-flight
  # (ORA-20401), so none of this applies to the local target, which reaches the
  # same AGENT_TOOLS package through the MCP wrapper containers instead.

  - changeSet:
      id: 018-enable-resource-principal
      author: paf-poc
      context: adb
      # Lets the database call Generative AI as the ADB instance itself, so the
      # Select AI profiles authenticate as OCI$RESOURCE_PRINCIPAL and no key
      # material is stored in the schema. It requires a tenancy-level dynamic
      # group covering the ADB and a policy granting it `use
      # generative-ai-family`; both come from deploy/tf/iam.
      changes:
        - sql:
            splitStatements: false
            sql: |-
              BEGIN
                DBMS_CLOUD_ADMIN.ENABLE_RESOURCE_PRINCIPAL(
                  username => 'AGENT_FACTORY'
                );
              EXCEPTION WHEN OTHERS THEN
                IF SQLCODE = -20000 THEN NULL; ELSE RAISE; END IF;
              END;

  - changeSet:
      id: 018-grant-select-ai-packages
      author: paf-poc
      context: adb
      # PAF checks for exactly this set before it will list the database as
      # eligible for Select AI profiles, agent tools and RAG vector indexes.
      #
      # DBMS_CLOUD is a public synonym for a versioned package, so the grant is
      # recorded against a name like DBMS_CLOUD$PDBCS_260821_1_0. Querying
      # dba_tab_privs for the literal name 'DBMS_CLOUD' makes it look ungranted.
      changes:
        - sql:
            sql: |-
              GRANT EXECUTE ON DBMS_CLOUD TO AGENT_FACTORY
        - sql:
            sql: |-
              GRANT EXECUTE ON DBMS_CLOUD_AI TO AGENT_FACTORY
        - sql:
            sql: |-
              GRANT EXECUTE ON DBMS_CLOUD_AI_AGENT TO AGENT_FACTORY
        - sql:
            sql: |-
              GRANT EXECUTE ON DBMS_CLOUD_PIPELINE TO AGENT_FACTORY

  - changeSet:
      id: 018-grant-agent-tools-execute-to-agent-factory
      author: paf-poc
      context: adb
      # The Select AI agent tools call this package as AGENT_FACTORY, so the
      # cloud tool channel needs the same EXECUTE the local MCP wrappers use.
      changes:
        - sql:
            sql: |-
              GRANT EXECUTE ON AGENT_TOOLS.PKG_AGENT_TOOLS TO AGENT_FACTORY
