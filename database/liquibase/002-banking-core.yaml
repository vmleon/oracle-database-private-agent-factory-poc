databaseChangeLog:
  # Banking core schema under BANK_CORE. Tables and FKs follow the sketch in
  # docs/DECISIONING-ENGINE-USE-CASE.md. JSON columns use Oracle 21c+
  # native JSON (binary OSON); requires max_string_size=EXTENDED, which
  # Autonomous Database sets.
  #
  # Decisioning-specific tables (decision Blockchain Table, decision_audit,
  # research_audit, hitl_task) come in 003-decisioning-audit-hitl.yaml;
  # chat conversation persistence in 004-chat-persistence.yaml.

  - changeSet:
      id: 002-create-customer
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.customer (
                customer_id    NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                full_name      VARCHAR2(200) NOT NULL,
                date_of_birth  DATE,
                residency      VARCHAR2(64),
                email          VARCHAR2(200),
                phone          VARCHAR2(40),
                kyc_status     VARCHAR2(20) DEFAULT 'PENDING' NOT NULL
                  CHECK (kyc_status IN ('PENDING','PASSED','FAILED')),
                kyc_updated_at TIMESTAMP,
                created_at     TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL
              )

  - changeSet:
      id: 002-create-customer-protected-attrs
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.customer_protected_attrs (
                customer_id NUMBER PRIMARY KEY
                  REFERENCES BANK_CORE.customer(customer_id) ON DELETE CASCADE,
                attrs       JSON
              )

  - changeSet:
      id: 002-create-product-catalog
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.product_catalog (
                product_id      NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                name            VARCHAR2(200) NOT NULL,
                product_type    VARCHAR2(20) NOT NULL,
                pricing_model   VARCHAR2(20) NOT NULL,
                min_amount      NUMBER(14,2) NOT NULL,
                max_amount      NUMBER(14,2) NOT NULL,
                min_term_months NUMBER NOT NULL,
                max_term_months NUMBER NOT NULL,
                currency        VARCHAR2(3) NOT NULL
              )

  - changeSet:
      id: 002-create-account
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.account (
                account_id    NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                customer_id   NUMBER NOT NULL
                  REFERENCES BANK_CORE.customer(customer_id),
                account_type  VARCHAR2(20) NOT NULL
                  CHECK (account_type IN ('CURRENT','SAVINGS','CREDIT_CARD')),
                currency      VARCHAR2(3) NOT NULL,
                opened_at     TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
                closed_at     TIMESTAMP
              )
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_account_customer ON BANK_CORE.account(customer_id)

  - changeSet:
      id: 002-create-loan-application
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.loan_application (
                application_id   NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                customer_id      NUMBER NOT NULL
                  REFERENCES BANK_CORE.customer(customer_id),
                product_id       NUMBER NOT NULL
                  REFERENCES BANK_CORE.product_catalog(product_id),
                amount_requested NUMBER(14,2) NOT NULL,
                term_months      NUMBER NOT NULL,
                purpose          VARCHAR2(200),
                channel          VARCHAR2(20) DEFAULT 'CHAT' NOT NULL,
                status           VARCHAR2(20) DEFAULT 'DRAFT' NOT NULL
                  CHECK (status IN ('DRAFT','SUBMITTED','IN_REVIEW',
                                    'APPROVED','REJECTED','REFER_HUMAN','EXPIRED')),
                submitted_at     TIMESTAMP,
                decided_at       TIMESTAMP
              )
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_loan_app_customer ON BANK_CORE.loan_application(customer_id)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_loan_app_status ON BANK_CORE.loan_application(status)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_loan_app_submitted ON BANK_CORE.loan_application(submitted_at)

  - changeSet:
      id: 002-create-loan-application-document
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.loan_application_document (
                doc_id         NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                application_id NUMBER NOT NULL
                  REFERENCES BANK_CORE.loan_application(application_id) ON DELETE CASCADE,
                doc_type       VARCHAR2(40),
                requested_type VARCHAR2(40),
                storage_uri    VARCHAR2(500) NOT NULL,
                uploaded_at    TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
                ocr_status     VARCHAR2(20) DEFAULT 'PENDING' NOT NULL
                  CHECK (ocr_status IN ('PENDING','PROCESSING','DONE','FAILED','RETRY')),
                ocr_payload    JSON,
                ocr_confidence NUMBER(5,4),
                quality_tier   VARCHAR2(20)
                  CHECK (quality_tier IN ('USABLE','MARGINAL','UNUSABLE'))
              )
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_loan_doc_app ON BANK_CORE.loan_application_document(application_id)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_loan_doc_ocr_status ON BANK_CORE.loan_application_document(ocr_status)

  # Tiny smoke-test seed — one product, three customers, two applications,
  # one uploaded document. Enough to verify the FKs and to query from
  # Select AI later. Larger synthetic generation lands in 010-seed-synthetic.
  - changeSet:
      id: 002-seed-smoke
      author: paf-poc
      changes:
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.product_catalog
                (name, product_type, pricing_model,
                 min_amount, max_amount, min_term_months, max_term_months, currency)
              VALUES
                ('Personal Loan', 'PERSONAL_LOAN', 'INTEREST',
                 1000, 50000, 6, 60, 'USD')
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.customer
                (full_name, date_of_birth, residency, email, phone, kyc_status, kyc_updated_at)
              VALUES
                ('Alice Salaried',  DATE '1988-04-12', 'RESIDENT', 'alice@example.com',  '+10000000001', 'PASSED', SYSTIMESTAMP)
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.customer
                (full_name, date_of_birth, residency, email, phone, kyc_status, kyc_updated_at)
              VALUES
                ('Bob Selfemployed', DATE '1979-09-30', 'RESIDENT', 'bob@example.com',    '+10000000002', 'PASSED', SYSTIMESTAMP)
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.customer
                (full_name, date_of_birth, residency, email, phone, kyc_status, kyc_updated_at)
              VALUES
                ('Carol Expat',     DATE '1992-01-21', 'EXPAT',    'carol@example.com',  '+10000000003', 'PENDING', NULL)
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.customer_protected_attrs (customer_id, attrs)
              SELECT customer_id, JSON('{"age_band":"30-39","gender":"F"}')
                FROM BANK_CORE.customer WHERE full_name='Alice Salaried'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.customer_protected_attrs (customer_id, attrs)
              SELECT customer_id, JSON('{"age_band":"40-49","gender":"M"}')
                FROM BANK_CORE.customer WHERE full_name='Bob Selfemployed'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.customer_protected_attrs (customer_id, attrs)
              SELECT customer_id, JSON('{"age_band":"30-39","gender":"F"}')
                FROM BANK_CORE.customer WHERE full_name='Carol Expat'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.loan_application
                (customer_id, product_id, amount_requested, term_months, purpose, channel, status, submitted_at)
              SELECT c.customer_id, p.product_id, 10000, 24, 'Home renovation', 'CHAT', 'SUBMITTED', SYSTIMESTAMP
                FROM BANK_CORE.customer c, BANK_CORE.product_catalog p
               WHERE c.full_name='Alice Salaried' AND p.name='Personal Loan'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.loan_application
                (customer_id, product_id, amount_requested, term_months, purpose, channel, status)
              SELECT c.customer_id, p.product_id, 25000, 48, 'Working capital', 'CHAT', 'DRAFT'
                FROM BANK_CORE.customer c, BANK_CORE.product_catalog p
               WHERE c.full_name='Bob Selfemployed' AND p.name='Personal Loan'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.loan_application_document
                (application_id, requested_type, storage_uri, ocr_status)
              SELECT la.application_id, 'PAYSLIP', 'oci://bucket/seed/alice-payslip.pdf', 'PENDING'
                FROM BANK_CORE.loan_application la
                JOIN BANK_CORE.customer c ON c.customer_id = la.customer_id
               WHERE c.full_name='Alice Salaried'

  # Additional banking-core tables needed by the BANK_VIEWS views in
  # 006-reporting-views.yaml: employment (income), account_transaction
  # (cashflow), credit_bureau_snapshot (score + total debt elsewhere),
  # existing_facility (monthly outflows that feed DTI). Sanctions list,
  # customer_identity and customer_address are deferred — not required
  # for the headline NL2SQL demo.

  - changeSet:
      id: 002-create-employment
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.employment (
                employment_id   NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                customer_id     NUMBER NOT NULL
                  REFERENCES BANK_CORE.customer(customer_id),
                employer_name   VARCHAR2(200),
                employment_type VARCHAR2(20) NOT NULL
                  CHECK (employment_type IN ('SALARIED','SELF_EMPLOYED','RETIRED','UNEMPLOYED','OTHER')),
                monthly_salary  NUMBER(14,2),
                tenure_months   NUMBER,
                is_current      CHAR(1) DEFAULT 'Y' NOT NULL
                  CHECK (is_current IN ('Y','N')),
                recorded_at     TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL
              )
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_employment_customer ON BANK_CORE.employment(customer_id)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_employment_current
                ON BANK_CORE.employment(customer_id, is_current)

  - changeSet:
      id: 002-create-account-transaction
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.account_transaction (
                txn_id        NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                account_id    NUMBER NOT NULL
                  REFERENCES BANK_CORE.account(account_id),
                txn_date      DATE NOT NULL,
                amount        NUMBER(14,2) NOT NULL,
                currency      VARCHAR2(3) NOT NULL,
                txn_type      VARCHAR2(20) NOT NULL
                  CHECK (txn_type IN ('SALARY','RENT','BILL','TRANSFER_IN','TRANSFER_OUT',
                                      'CARD_PURCHASE','ATM_WITHDRAWAL','FEE','INTEREST','OTHER')),
                description   VARCHAR2(200),
                balance_after NUMBER(14,2)
              )
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_txn_account ON BANK_CORE.account_transaction(account_id, txn_date)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_txn_type ON BANK_CORE.account_transaction(txn_type)

  - changeSet:
      id: 002-create-credit-bureau-snapshot
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.credit_bureau_snapshot (
                snapshot_id           NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                customer_id           NUMBER NOT NULL
                  REFERENCES BANK_CORE.customer(customer_id),
                snapshot_date         DATE NOT NULL,
                score                 NUMBER,
                score_scale_min       NUMBER,
                score_scale_max       NUMBER,
                bureau_name           VARCHAR2(80),
                total_debt            NUMBER(14,2),
                num_open_facilities   NUMBER,
                num_late_payments_12m NUMBER
              )
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_bureau_customer_date
                ON BANK_CORE.credit_bureau_snapshot(customer_id, snapshot_date)

  - changeSet:
      id: 002-create-existing-facility
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.existing_facility (
                facility_id     NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                customer_id     NUMBER NOT NULL
                  REFERENCES BANK_CORE.customer(customer_id),
                lender_name     VARCHAR2(200),
                facility_type   VARCHAR2(20) NOT NULL
                  CHECK (facility_type IN ('PERSONAL_LOAN','CREDIT_CARD','MORTGAGE','AUTO_LOAN','OTHER')),
                balance         NUMBER(14,2),
                monthly_payment NUMBER(14,2),
                opened_at       DATE,
                closed_at       DATE
              )
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_existing_facility_customer
                ON BANK_CORE.existing_facility(customer_id)

  # Small seed for the three demo customers so views are queryable
  # immediately. Alice: clean salaried profile. Bob: mid-risk self-employed.
  # Carol: high-risk expat (still PENDING KYC). Larger generation in
  # 010-seed-synthetic.
  - changeSet:
      id: 002-seed-smoke-extras
      author: paf-poc
      changes:
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.employment
                (customer_id, employer_name, employment_type, monthly_salary, tenure_months)
              SELECT customer_id, 'Acme Tech Ltd', 'SALARIED', 5500, 36
                FROM BANK_CORE.customer WHERE full_name='Alice Salaried'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.employment
                (customer_id, employer_name, employment_type, monthly_salary, tenure_months)
              SELECT customer_id, 'Bob Consulting LLC', 'SELF_EMPLOYED', 7200, 18
                FROM BANK_CORE.customer WHERE full_name='Bob Selfemployed'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.employment
                (customer_id, employer_name, employment_type, monthly_salary, tenure_months)
              SELECT customer_id, 'Globex Inc', 'SALARIED', 4200, 12
                FROM BANK_CORE.customer WHERE full_name='Carol Expat'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.credit_bureau_snapshot
                (customer_id, snapshot_date, score, score_scale_min, score_scale_max,
                 bureau_name, total_debt, num_open_facilities, num_late_payments_12m)
              SELECT customer_id, TRUNC(SYSDATE)-15, 742, 300, 850,
                     'Demo Bureau', 1500, 1, 0
                FROM BANK_CORE.customer WHERE full_name='Alice Salaried'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.credit_bureau_snapshot
                (customer_id, snapshot_date, score, score_scale_min, score_scale_max,
                 bureau_name, total_debt, num_open_facilities, num_late_payments_12m)
              SELECT customer_id, TRUNC(SYSDATE)-10, 641, 300, 850,
                     'Demo Bureau', 16500, 2, 2
                FROM BANK_CORE.customer WHERE full_name='Bob Selfemployed'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.credit_bureau_snapshot
                (customer_id, snapshot_date, score, score_scale_min, score_scale_max,
                 bureau_name, total_debt, num_open_facilities, num_late_payments_12m)
              SELECT customer_id, TRUNC(SYSDATE)-20, 580, 300, 850,
                     'Demo Bureau', 22000, 5, 4
                FROM BANK_CORE.customer WHERE full_name='Carol Expat'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.existing_facility
                (customer_id, lender_name, facility_type, balance, monthly_payment, opened_at)
              SELECT customer_id, 'First Bank', 'CREDIT_CARD', 1500, 150, ADD_MONTHS(SYSDATE,-12)
                FROM BANK_CORE.customer WHERE full_name='Alice Salaried'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.existing_facility
                (customer_id, lender_name, facility_type, balance, monthly_payment, opened_at)
              SELECT customer_id, 'First Bank', 'CREDIT_CARD', 8500, 350, ADD_MONTHS(SYSDATE,-24)
                FROM BANK_CORE.customer WHERE full_name='Bob Selfemployed'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.existing_facility
                (customer_id, lender_name, facility_type, balance, monthly_payment, opened_at)
              SELECT customer_id, 'Other Bank', 'AUTO_LOAN', 8000, 250, ADD_MONTHS(SYSDATE,-18)
                FROM BANK_CORE.customer WHERE full_name='Bob Selfemployed'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.existing_facility
                (customer_id, lender_name, facility_type, balance, monthly_payment, opened_at)
              SELECT customer_id, 'Yet Another Bank', 'MORTGAGE', 195000, 1100, ADD_MONTHS(SYSDATE,-60)
                FROM BANK_CORE.customer WHERE full_name='Carol Expat'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account (customer_id, account_type, currency, opened_at)
              SELECT customer_id, 'CURRENT', 'USD', ADD_MONTHS(SYSDATE,-36)
                FROM BANK_CORE.customer WHERE full_name='Alice Salaried'
                  AND NOT EXISTS (SELECT 1 FROM BANK_CORE.account a WHERE a.customer_id = BANK_CORE.customer.customer_id)
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-30, 5500, 'USD', 'SALARY', 'Acme payroll', 8200
                FROM BANK_CORE.account a JOIN BANK_CORE.customer c ON c.customer_id = a.customer_id
               WHERE c.full_name='Alice Salaried' AND a.account_type='CURRENT'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-25, -1200, 'USD', 'RENT', 'Monthly rent', 7000
                FROM BANK_CORE.account a JOIN BANK_CORE.customer c ON c.customer_id = a.customer_id
               WHERE c.full_name='Alice Salaried' AND a.account_type='CURRENT'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-15, -150, 'USD', 'CARD_PURCHASE', 'Card payment', 6850
                FROM BANK_CORE.account a JOIN BANK_CORE.customer c ON c.customer_id = a.customer_id
               WHERE c.full_name='Alice Salaried' AND a.account_type='CURRENT'
