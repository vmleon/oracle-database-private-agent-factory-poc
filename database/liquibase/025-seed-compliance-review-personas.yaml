  # Six large round-number transfers out inside thirty days: one more than the
  # suspicious-pattern rule tolerates, on top of an ordinary salary credit.
  - changeSet:
      id: 025-seed-sam-account-and-outflows
      author: paf-poc
      context: seed
      changes:
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account (customer_id, account_type, currency, opened_at)
              SELECT customer_id, 'CURRENT', 'USD', ADD_MONTHS(SYSDATE,-36)
                FROM BANK_CORE.customer WHERE full_name='Sam RoundNumbers'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-28, 6200, 'USD', 'SALARY', 'Acme payroll', 38200
                FROM BANK_CORE.account a JOIN BANK_CORE.customer c ON c.customer_id = a.customer_id
               WHERE c.full_name='Sam RoundNumbers' AND a.account_type='CURRENT'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-26, -5000, 'USD', 'TRANSFER_OUT', 'Transfer out', 33200
                FROM BANK_CORE.account a JOIN BANK_CORE.customer c ON c.customer_id = a.customer_id
               WHERE c.full_name='Sam RoundNumbers' AND a.account_type='CURRENT'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-22, -5000, 'USD', 'TRANSFER_OUT', 'Transfer out', 28200
                FROM BANK_CORE.account a JOIN BANK_CORE.customer c ON c.customer_id = a.customer_id
               WHERE c.full_name='Sam RoundNumbers' AND a.account_type='CURRENT'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-17, -5000, 'USD', 'TRANSFER_OUT', 'Transfer out', 23200
                FROM BANK_CORE.account a JOIN BANK_CORE.customer c ON c.customer_id = a.customer_id
               WHERE c.full_name='Sam RoundNumbers' AND a.account_type='CURRENT'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-12, -5000, 'USD', 'TRANSFER_OUT', 'Transfer out', 18200
                FROM BANK_CORE.account a JOIN BANK_CORE.customer c ON c.customer_id = a.customer_id
               WHERE c.full_name='Sam RoundNumbers' AND a.account_type='CURRENT'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-7, -5000, 'USD', 'TRANSFER_OUT', 'Transfer out', 13200
                FROM BANK_CORE.account a JOIN BANK_CORE.customer c ON c.customer_id = a.customer_id
               WHERE c.full_name='Sam RoundNumbers' AND a.account_type='CURRENT'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-3, -5000, 'USD', 'TRANSFER_OUT', 'Transfer out', 8200
                FROM BANK_CORE.account a JOIN BANK_CORE.customer c ON c.customer_id = a.customer_id
               WHERE c.full_name='Sam RoundNumbers' AND a.account_type='CURRENT'
