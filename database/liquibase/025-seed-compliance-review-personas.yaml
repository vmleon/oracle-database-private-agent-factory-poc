databaseChangeLog:
  # The review side of the compliance bar. Marlowe and Nina show the two hard
  # bars; these three are clean in every respect a lender cares about and each
  # carries exactly one compliance warning, so the REVIEW is attributable to it
  # and nothing else. A pending identity check may be named to the customer;
  # the screening findings may not.
  - changeSet:
      id: 025-seed-omar-customer
      author: paf-poc
      context: seed
      changes:
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.customer
                (full_name, date_of_birth, residency, email, phone, kyc_status, kyc_updated_at)
              VALUES
                ('Omar PendingKyc', DATE '1984-07-30', 'RESIDENT',
                 'omar@example.com', '+10000000023', 'PENDING', SYSTIMESTAMP)
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.customer_protected_attrs (customer_id, attrs)
              SELECT customer_id, JSON('{"age_band":"40-49","gender":"M"}')
                FROM BANK_CORE.customer WHERE full_name='Omar PendingKyc'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.employment
                (customer_id, employer_name, employment_type, monthly_salary, is_current)
              SELECT customer_id, 'Acme Tech Ltd', 'SALARIED', 6200, 'Y'
                FROM BANK_CORE.customer WHERE full_name='Omar PendingKyc'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.credit_bureau_snapshot
                (customer_id, snapshot_date, score, score_scale_min, score_scale_max)
              SELECT customer_id, SYSDATE, 730, 300, 850
                FROM BANK_CORE.customer WHERE full_name='Omar PendingKyc'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.loan_application
                (customer_id, product_id, amount_requested, term_months, purpose,
                 channel, status, submitted_at)
              SELECT c.customer_id, p.product_id, 12000, 36, 'Home renovation',
                     'CHAT', 'SUBMITTED', SYSTIMESTAMP
                FROM BANK_CORE.customer c, BANK_CORE.product_catalog p
               WHERE c.full_name='Omar PendingKyc' AND p.product_type='PERSONAL_LOAN'

