databaseChangeLog:
  # The other side of the compliance bar. Nina is identical to Marlowe in every
  # respect a lender cares about — registered employer, healthy credit file, an
  # ordinary amount over an ordinary term — and differs only in that her identity
  # checks failed. She exists so the decline is attributable to that and nothing
  # else, and so the pair shows the disclosure split: an identity check may be
  # named to the customer, a screening finding may not.
  - changeSet:
      id: 024-seed-failed-kyc-customer
      author: paf-poc
      context: seed
      changes:
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.customer
                (full_name, date_of_birth, residency, email, phone, kyc_status, kyc_updated_at)
              VALUES
                ('Nina FailedKyc', DATE '1986-02-17', 'RESIDENT',
                 'nina@example.com', '+10000000022', 'FAILED', SYSTIMESTAMP)
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.customer_protected_attrs (customer_id, attrs)
              SELECT customer_id, JSON('{"age_band":"30-39","gender":"F"}')
                FROM BANK_CORE.customer WHERE full_name='Nina FailedKyc'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.employment
                (customer_id, employer_name, employment_type, monthly_salary, is_current)
              SELECT customer_id, 'Acme Tech Ltd', 'SALARIED', 6200, 'Y'
                FROM BANK_CORE.customer WHERE full_name='Nina FailedKyc'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.credit_bureau_snapshot
                (customer_id, snapshot_date, score, score_scale_min, score_scale_max)
              SELECT customer_id, SYSDATE, 730, 300, 850
                FROM BANK_CORE.customer WHERE full_name='Nina FailedKyc'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.loan_application
                (customer_id, product_id, amount_requested, term_months, purpose,
                 channel, status, submitted_at)
              SELECT c.customer_id, p.product_id, 12000, 36, 'Home renovation',
                     'CHAT', 'SUBMITTED', SYSTIMESTAMP
                FROM BANK_CORE.customer c, BANK_CORE.product_catalog p
               WHERE c.full_name='Nina FailedKyc' AND p.product_type='PERSONAL_LOAN'
