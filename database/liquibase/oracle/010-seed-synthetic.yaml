  - changeSet:
      id: 010-seed-transactions
      author: paf-poc
      context: seed
      # Three months of representative activity per customer (salary in,
      # one rent debit, one card purchase). Just enough for the NL2SQL
      # views to return non-empty aggregates.
      changes:
        - sql:
            sql: |-
              INSERT INTO APP.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-d.dd, sal.amount, 'USD', 'SALARY', sal.note, sal.amount
                FROM APP.account a
                JOIN APP.customer c ON c.customer_id = a.customer_id
                JOIN (
                  SELECT 'David HighDti'        AS nm, 3500  AS amount, 'Acme payroll'     AS note FROM dual UNION ALL
                  SELECT 'Eva LowScore',                4200,           'Globex payroll'         FROM dual UNION ALL
                  SELECT 'Frank MidBand',               5100,           'Initech payroll'        FROM dual UNION ALL
                  SELECT 'Grace LargeAsk',             12000,           'Stark payroll'          FROM dual UNION ALL
                  SELECT 'Henry MarginalDoc',           6000,           'Wayne payroll'          FROM dual UNION ALL
                  SELECT 'Iris UnusableDocs',           5800,           'Soylent payroll'        FROM dual UNION ALL
                  SELECT 'Jane UnknownEmployer',        5300,           'Atlantis payroll'       FROM dual UNION ALL
                  SELECT 'Kyle DormantEmployer',        5500,           'Phoenix payroll'        FROM dual
                ) sal ON sal.nm = c.full_name
                CROSS JOIN (
                  SELECT 60 AS dd FROM dual UNION ALL
                  SELECT 30 FROM dual UNION ALL
                  SELECT 1  FROM dual
                ) d
               WHERE a.account_type = 'CURRENT'
        - sql:
            sql: |-
              INSERT INTO APP.account_transaction
                (account_id, txn_date, amount, currency, txn_type, description, balance_after)
              SELECT a.account_id, TRUNC(SYSDATE)-d.dd, -1200, 'USD', 'RENT', 'Monthly rent', 0
                FROM APP.account a
                JOIN APP.customer c ON c.customer_id = a.customer_id
                CROSS JOIN (
                  SELECT 55 AS dd FROM dual UNION ALL
                  SELECT 25 FROM dual UNION ALL
                  SELECT 5  FROM dual
                ) d
               WHERE a.account_type = 'CURRENT'
                 AND c.full_name IN ('David HighDti','Eva LowScore','Frank MidBand',
                                     'Grace LargeAsk','Henry MarginalDoc','Iris UnusableDocs',
                                     'Jane UnknownEmployer','Kyle DormantEmployer')

