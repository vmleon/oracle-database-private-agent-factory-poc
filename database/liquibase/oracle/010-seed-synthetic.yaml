databaseChangeLog:
  # Synthetic dataset that exercises the test-bench scenarios from
  # docs/DECISIONING-ENGINE-USE-CASE.md §"Scenarios". 002-banking-core
  # already seeds Alice / Bob / Carol as a smoke trio (clean salaried /
  # self-employed / expat-pending-KYC); this changelog adds the customers
  # whose profiles trigger the specific decision paths the agent has to
  # handle.
  #
  # Each new customer maps to one scenario:
  #
  #   #2  DTI above hard cap          → David
  #   #3  Score below configured floor → Eva
  #   #6  Mid-band score                → Frank
  #   #7  Large amount, clean profile  → Grace
  #   #8  One MARGINAL document        → Henry
  #   #9  All UNUSABLE documents       → Iris
  #   #27 Employer not in registry     → Jane
  #   #28 Employer dormant in registry → Kyle
  #
  # Scenarios not seeded here:
  #   - #1 (clean APPROVE) is Alice from 002.
  #   - #5 needs sanctions_list — table not created in any prior changeset.
  #   - #10 needs fair_lending_review pre-flight — separate flow.
  #   - #11–#29 are runtime behaviours (agent / queue / UI) — no seed
  #     pre-data needed beyond what these eight provide.
  #
  # case_history seed: structured fields only; case_embedding stays NULL.
  # Vector retrieval needs bge-m3 over Ollama (the embedding pipeline lands
  # outside Liquibase). NL2SQL filter queries from RESEARCH_AGENT still work
  # against the structured columns.
  #
  # policy_corpus: not seeded here — same embedding-pipeline reason, plus
  # the actual policy text comes from the kit's policy docs, not inline SQL.
  #
  # All changesets run under `context: seed`. Cloud (or any environment
  # that wants a clean schema) sets `--contexts="!seed"` to skip.

