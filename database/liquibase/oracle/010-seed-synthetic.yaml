  - changeSet:
      id: 010-seed-application-documents
      author: paf-poc
      context: seed
      # Henry's payslip is MARGINAL → scenario 8 path. Iris's three docs
      # are all UNUSABLE → scenario 9 path. ocr_status=DONE so the agent
      # picks up the quality_tier without waiting on the OCR worker.
      changes:
        - sql:
            sql: |-
              INSERT INTO APP.loan_application_document
                (application_id, doc_type, requested_type, storage_uri, ocr_status, quality_tier)
              SELECT la.application_id, 'PAYSLIP', 'PAYSLIP',
                     'oci://bucket/seed/henry-payslip.pdf', 'DONE', 'MARGINAL'
                FROM APP.loan_application la
                JOIN APP.customer c ON c.customer_id = la.customer_id
               WHERE c.full_name='Henry MarginalDoc'
