databaseChangeLog:
  # REPORTING.cust_360 — one curated row per customer: demographics, current
  # employment, latest bureau snapshot, account holdings + balances, last-90-day
  # transaction features, and internal existing-debt. It consolidates what the
  # chat_v_* views expose separately into a single feature surface.
  #
  # Consumers: CHAT_WORKFLOW (one view to NL2SQL against), the future
  # product-recommendation workflow, and — primarily — the §3 XGBoost training,
  # which reads one row per customer as one training example.
  #
  # Fair-lending by construction: protected attributes (APP.customer_protected_attrs)
  # are deliberately NOT joined, so the feature table can never carry them.
  #
  # Grain is one row per customer: every child table is aggregated to the
  # customer in a subquery and LEFT JOINed, so a customer with no accounts /
  # transactions / facilities still appears (count/sum features default to 0;
  # bureau and employment fields stay NULL = "unknown" rather than a fake 0).
  #
  # REPORTING already holds SELECT on every base table here (changeset 006), so
  # no new base-table grants are needed — only the view grant to AGENT_FACTORY.

  - changeSet:
      id: 015-create-customer-360-view
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE OR REPLACE VIEW REPORTING.cust_360 AS
              SELECT
                c.customer_id,
                c.full_name,
                TRUNC(MONTHS_BETWEEN(SYSDATE, c.date_of_birth) / 12) AS age_years,
                c.residency,
                c.kyc_status,
                -- current employment
                e.employer_name,
                e.employment_type,
                e.monthly_salary,
                e.tenure_months,
                -- latest bureau snapshot (NULL when the customer has none)
                b.credit_score,
                b.total_debt              AS bureau_total_debt,
                b.num_open_facilities     AS bureau_num_open_facilities,
                b.num_late_payments_12m,
                -- account holdings + balances
                NVL(acc.num_accounts, 0)      AS num_accounts,
                NVL(acc.num_current, 0)       AS num_current_accounts,
                NVL(acc.num_savings, 0)       AS num_savings_accounts,
                NVL(acc.num_credit_cards, 0)  AS num_credit_cards,
                NVL(bal.total_balance, 0)     AS total_balance,
                -- transaction features over the last 90 days
                NVL(tx.txn_count_90d, 0)      AS txn_count_90d,
                NVL(tx.credits_90d, 0)        AS credits_90d,
                NVL(tx.debits_90d, 0)         AS debits_90d,
                NVL(tx.salary_credits_90d, 0) AS salary_credits_90d,
                -- internal open facilities (the bank's own view of existing debt)
                NVL(fac.existing_monthly_debt, 0)  AS existing_monthly_debt,
                NVL(fac.num_open_facilities, 0)    AS num_open_facilities_internal
              FROM APP.customer c
              LEFT JOIN APP.employment e
                ON e.customer_id = c.customer_id
                AND e.is_current = 'Y'
              LEFT JOIN (
                SELECT s.customer_id,
                       s.score                 AS credit_score,
                       s.total_debt,
                       s.num_open_facilities,
                       s.num_late_payments_12m
                  FROM APP.credit_bureau_snapshot s
                 WHERE s.snapshot_date = (
                   SELECT MAX(s2.snapshot_date)
                     FROM APP.credit_bureau_snapshot s2
                    WHERE s2.customer_id = s.customer_id
                 )
              ) b ON b.customer_id = c.customer_id
              LEFT JOIN (
                SELECT customer_id,
                       COUNT(*)                                               AS num_accounts,
                       COUNT(CASE WHEN account_type = 'CURRENT'     THEN 1 END) AS num_current,
                       COUNT(CASE WHEN account_type = 'SAVINGS'     THEN 1 END) AS num_savings,
                       COUNT(CASE WHEN account_type = 'CREDIT_CARD' THEN 1 END) AS num_credit_cards
                  FROM APP.account
                 WHERE closed_at IS NULL
                 GROUP BY customer_id
              ) acc ON acc.customer_id = c.customer_id
              LEFT JOIN (
                -- latest balance_after per open account, summed to the customer
                SELECT customer_id, SUM(balance_after) AS total_balance
                  FROM (
                    SELECT a.customer_id,
                           t.balance_after,
                           ROW_NUMBER() OVER (PARTITION BY t.account_id
                                              ORDER BY t.txn_date DESC, t.txn_id DESC) AS rn
                      FROM APP.account_transaction t
                      JOIN APP.account a ON a.account_id = t.account_id
                     WHERE a.closed_at IS NULL
                  )
                 WHERE rn = 1
                 GROUP BY customer_id
              ) bal ON bal.customer_id = c.customer_id
              LEFT JOIN (
                SELECT a.customer_id,
                       COUNT(*)                                                    AS txn_count_90d,
                       SUM(CASE WHEN t.amount > 0 THEN t.amount ELSE 0 END)        AS credits_90d,
                       SUM(CASE WHEN t.amount < 0 THEN -t.amount ELSE 0 END)       AS debits_90d,
                       SUM(CASE WHEN t.txn_type = 'SALARY' THEN t.amount ELSE 0 END) AS salary_credits_90d
                  FROM APP.account_transaction t
                  JOIN APP.account a ON a.account_id = t.account_id
                 WHERE t.txn_date >= SYSDATE - 90
                 GROUP BY a.customer_id
              ) tx ON tx.customer_id = c.customer_id
              LEFT JOIN (
                SELECT customer_id,
                       SUM(monthly_payment) AS existing_monthly_debt,
                       COUNT(*)             AS num_open_facilities
                  FROM APP.existing_facility
                 WHERE closed_at IS NULL
                 GROUP BY customer_id
              ) fac ON fac.customer_id = c.customer_id
        - sql:
            sql: |-
              GRANT SELECT ON REPORTING.cust_360 TO AGENT_FACTORY
