databaseChangeLog:
  # David HighDti seed fix: bump his credit-card monthly_payment so the
  # scenario actually exceeds the configured DTI hard cap.
  #
  # Original seed in 010-seed-synthetic produced DTI = 0.44 with the
  # banking-mcp server-side arithmetic (cap = 0.45), so eligibility's
  # deny[] stayed empty and the recommendation tier landed on APPROVE —
  # the opposite of what the "HighDti" scenario name implies. The previous
  # DECLINE outcome came from Qwen mis-computing DTI in-prompt and
  # accidentally landing on the right tier for the wrong reason.
  #
  # New monthly_payment 600 → DTI = (600 + 520 + 555.56) / 3500 = 0.48,
  # comfortably above the 0.45 cap.

  - changeSet:
      id: 012-fixup-david-dti
      author: paf-poc
      context: seed
      changes:
        - sql:
            sql: |-
              UPDATE APP.existing_facility
                 SET monthly_payment = 600
               WHERE lender_name    = 'First Bank'
                 AND facility_type  = 'CREDIT_CARD'
                 AND customer_id    = (SELECT customer_id
                                         FROM APP.customer
                                        WHERE full_name = 'David HighDti')
