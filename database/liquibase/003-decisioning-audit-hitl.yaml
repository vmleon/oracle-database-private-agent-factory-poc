databaseChangeLog:
  # Decisioning tables under BANK_CORE — the agent's write surface for a credit
  # decision and its full audit trail. DDL follows the sketch in
  # docs/DECISIONING-ENGINE-USE-CASE.md. Blockchain Tables on Oracle 21c+
  # enforce append-only semantics at the kernel level; no foreign keys are
  # permitted into or out of them, so application_id is a soft reference
  # and the table cannot reference loan_application directly.
  #
  # Design model (see DESIGN.md §8 / USE-CASE.md):
  # - CHAT_AGENT writes its recommendation packet to hitl_task and never
  #   writes to decision.
  # - The Application Service writes the decision Blockchain row when the
  #   reviewer closes the HITL task. One row = one bank decision, carrying
  #   both the human's outcome and the original agent recommendation packet.
  # - research_audit captures RESEARCH_AGENT tool calls separately from
  #   decision_audit so research traces don't pollute the decisioning trail.
  #
  # Conversation persistence (chat_message) lives in 004-chat-persistence.yaml.

  - changeSet:
      id: 003-create-decision-blockchain-table
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE BLOCKCHAIN TABLE BANK_CORE.decision (
                decision_id          NUMBER GENERATED ALWAYS AS IDENTITY,
                application_id       NUMBER NOT NULL,
                -- Human's final decision (written by the Application Service on HITL close)
                human_outcome        VARCHAR2(20) NOT NULL
                  CHECK (human_outcome IN ('APPROVE','DECLINE')),
                human_user           VARCHAR2(120) NOT NULL,
                human_note           CLOB,
                decided_at           TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
                -- Agent recommendation packet (copied from hitl_task at close)
                agent_recommendation VARCHAR2(20) NOT NULL
                  CHECK (agent_recommendation IN ('APPROVE','REVIEW','DECLINE')),
                agent_reasoning      CLOB,
                agent_explore_hints  JSON,
                agent_evidence       JSON,
                agent_run_id         VARCHAR2(60) NOT NULL,
                -- Outcome economics
                pricing_offer        JSON,
                reason_codes         JSON,
                computed_dti         NUMBER(5,2),
                computed_pti         NUMBER(5,2),
                CONSTRAINT uq_decision_id UNIQUE (decision_id)
              ) NO DROP UNTIL 2555 DAYS IDLE
                NO DELETE LOCKED
                HASHING USING "SHA2_512" VERSION "v1"
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_decision_application ON BANK_CORE.decision(application_id)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_decision_agent_run ON BANK_CORE.decision(agent_run_id)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_decision_human_outcome ON BANK_CORE.decision(human_outcome)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_decision_agent_recommendation
                ON BANK_CORE.decision(agent_recommendation)

  - changeSet:
      id: 003-create-decision-audit
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.decision_audit (
                audit_id     NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                agent_run_id VARCHAR2(60) NOT NULL,
                step_no      NUMBER NOT NULL,
                tool_name    VARCHAR2(80) NOT NULL,
                tool_input   JSON,
                tool_output  JSON,
                started_at   TIMESTAMP NOT NULL,
                ended_at     TIMESTAMP,
                duration_ms  NUMBER,
                status       VARCHAR2(20) NOT NULL
                  CHECK (status IN ('SUCCESS','FAILED','SKIPPED','TIMEOUT'))
              )
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_decision_audit_run ON BANK_CORE.decision_audit(agent_run_id)
        - sql:
            sql: |-
              CREATE UNIQUE INDEX BANK_CORE.uq_decision_audit_step
                ON BANK_CORE.decision_audit(agent_run_id, step_no)

  - changeSet:
      id: 003-create-research-audit
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.research_audit (
                audit_id        NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                research_run_id VARCHAR2(60) NOT NULL,
                hitl_task_id    NUMBER,
                reviewer        VARCHAR2(120) NOT NULL,
                step_no         NUMBER NOT NULL,
                tool_name       VARCHAR2(80) NOT NULL,
                tool_input      JSON,
                tool_output     JSON,
                started_at      TIMESTAMP NOT NULL,
                ended_at        TIMESTAMP,
                duration_ms     NUMBER,
                status          VARCHAR2(20) NOT NULL
                  CHECK (status IN ('SUCCESS','FAILED','SKIPPED','TIMEOUT'))
              )
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_research_audit_run
                ON BANK_CORE.research_audit(research_run_id)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_research_audit_task
                ON BANK_CORE.research_audit(hitl_task_id)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_research_audit_reviewer
                ON BANK_CORE.research_audit(reviewer)
        - sql:
            sql: |-
              CREATE UNIQUE INDEX BANK_CORE.uq_research_audit_step
                ON BANK_CORE.research_audit(research_run_id, step_no)

  - changeSet:
      id: 003-create-hitl-task
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.hitl_task (
                task_id              NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                application_id       NUMBER NOT NULL
                  REFERENCES BANK_CORE.loan_application(application_id),
                assigned_to          VARCHAR2(120),
                state                VARCHAR2(20) DEFAULT 'OPEN' NOT NULL
                  CHECK (state IN ('OPEN','IN_REVIEW','CLOSED','EXPIRED')),
                -- Agent recommendation packet (written by create_hitl_task at task creation)
                agent_recommendation VARCHAR2(20) NOT NULL
                  CHECK (agent_recommendation IN ('APPROVE','REVIEW','DECLINE')),
                agent_reasoning      CLOB,
                agent_explore_hints  JSON,
                agent_evidence       JSON,
                agent_run_id         VARCHAR2(60) NOT NULL,
                -- Reviewer close-out (populated when state = CLOSED)
                human_outcome        VARCHAR2(20)
                  CHECK (human_outcome IN ('APPROVE','DECLINE')),
                human_note           CLOB,
                human_user           VARCHAR2(120),
                created_at           TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
                closed_at            TIMESTAMP
              )
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_hitl_task_application ON BANK_CORE.hitl_task(application_id)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_hitl_task_state ON BANK_CORE.hitl_task(state)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_hitl_task_assignee ON BANK_CORE.hitl_task(assigned_to)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_hitl_task_recommendation
                ON BANK_CORE.hitl_task(agent_recommendation)
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_hitl_task_agent_run ON BANK_CORE.hitl_task(agent_run_id)
