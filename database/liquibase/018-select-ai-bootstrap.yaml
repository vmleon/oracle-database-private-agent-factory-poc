databaseChangeLog:
  # Select AI is the Autonomous Database tool channel: the same
  # AGENT_TOOLS.PKG_AGENT_TOOLS package the local target reaches through MCP
  # wrapper containers is reached here through DBMS_CLOUD_AI profiles.
  #
  # Oracle Database Free rejects a custom provider_endpoint pre-flight
  # (ORA-20401), so none of this runs on the local target.
  #
  # Two profiles, each pinned to its own REPORTING view set:
  #   chat_profile     → REPORTING.chat_v_*     (customer-safe)
  #   research_profile → REPORTING.research_v_* (broader read-only)

  - changeSet:
      id: 018-enable-resource-principal
      author: paf-poc
      context: adb
      runOnChange: true
      # A resource principal lets the database call the Generative AI service
      # as the ADB instance itself, so no API key or credential secret is
      # stored in the schema. It requires a tenancy-level dynamic group
      # covering the ADB and a policy granting it `use generative-ai-family`;
      # both are created once by an administrator outside this stack.
      changes:
        - sql:
            splitStatements: false
            sql: |-
              BEGIN
                DBMS_CLOUD_ADMIN.ENABLE_RESOURCE_PRINCIPAL(
                  username => 'AGENT_FACTORY'
                );
              EXCEPTION WHEN OTHERS THEN
                IF SQLCODE = -20000 THEN NULL; ELSE RAISE; END IF;
              END;

  - changeSet:
      id: 018-create-chat-profile
      author: paf-poc
      context: adb
      runOnChange: true
      # Dropped and recreated on every run so a changed model or compartment
      # propagates without a new changeset.
      changes:
        - sql:
            splitStatements: false
            sql: |-
              BEGIN
                BEGIN
                  DBMS_CLOUD_AI.DROP_PROFILE(profile_name => 'chat_profile');
                EXCEPTION WHEN OTHERS THEN NULL;
                END;
                DBMS_CLOUD_AI.CREATE_PROFILE(
                  profile_name => 'chat_profile',
                  attributes   => q'!{
                    "provider": "oci",
                    "credential_name": "OCI$RESOURCE_PRINCIPAL",
                    "region": "${genai_region}",
                    "oci_compartment_id": "${genai_compartment_ocid}",
                    "model": "${genai_model}",
                    "temperature": "0",
                    "conversation": "true",
                    "object_list": [
                      {"owner": "REPORTING", "name": "chat_v_applicant_profile"},
                      {"owner": "REPORTING", "name": "chat_v_transactions_summary"},
                      {"owner": "REPORTING", "name": "chat_v_credit_bureau"},
                      {"owner": "REPORTING", "name": "chat_v_existing_facilities"},
                      {"owner": "REPORTING", "name": "chat_v_loan_application"},
                      {"owner": "REPORTING", "name": "chat_v_application_document"}
                    ]
                  }!'
                );
              END;

  - changeSet:
      id: 018-create-research-profile
      author: paf-poc
      context: adb
      runOnChange: true
      changes:
        - sql:
            splitStatements: false
            sql: |-
              BEGIN
                BEGIN
                  DBMS_CLOUD_AI.DROP_PROFILE(profile_name => 'research_profile');
                EXCEPTION WHEN OTHERS THEN NULL;
                END;
                DBMS_CLOUD_AI.CREATE_PROFILE(
                  profile_name => 'research_profile',
                  attributes   => q'!{
                    "provider": "oci",
                    "credential_name": "OCI$RESOURCE_PRINCIPAL",
                    "region": "${genai_region}",
                    "oci_compartment_id": "${genai_compartment_ocid}",
                    "model": "${genai_model}",
                    "temperature": "0",
                    "conversation": "true",
                    "object_list": [
                      {"owner": "REPORTING", "name": "research_v_full_transactions"},
                      {"owner": "REPORTING", "name": "research_v_decision_history"},
                      {"owner": "REPORTING", "name": "research_v_decision_audit"},
                      {"owner": "REPORTING", "name": "research_v_research_audit"},
                      {"owner": "REPORTING", "name": "research_v_policy_parameter_history"},
                      {"owner": "REPORTING", "name": "research_v_hitl_task"}
                    ]
                  }!'
                );
              END;
