databaseChangeLog:
  # Application objects live in the DATA tablespace, and database links are
  # created through DBMS_CLOUD_ADMIN rather than the CREATE DATABASE LINK
  # privilege, so every user here is created the Autonomous Database way.
  # `context: adb` is a runtime filter selected by `--contexts=adb,seed`.

  - changeSet:
      id: 001-create-app-user-adb
      author: paf-poc
      context: adb
      changes:
        - sql:
            sql: |-
              CREATE USER APP IDENTIFIED BY "${db_password}"
                DEFAULT TABLESPACE DATA
                QUOTA UNLIMITED ON DATA
        - sql:
            sql: |-
              GRANT CREATE SESSION, CREATE TABLE, CREATE VIEW, CREATE SEQUENCE,
                    CREATE PROCEDURE, CREATE TRIGGER, CREATE TYPE TO APP

  - changeSet:
      id: 001-create-reporting-user-adb
      author: paf-poc
      context: adb
      changes:
        - sql:
            sql: |-
              CREATE USER REPORTING IDENTIFIED BY "${db_password}"
                DEFAULT TABLESPACE DATA
                QUOTA UNLIMITED ON DATA
        - sql:
            sql: |-
              GRANT CREATE SESSION, CREATE VIEW TO REPORTING

  - changeSet:
      id: 001-create-agent-tools-user-adb
      author: paf-poc
      context: adb
      changes:
        - sql:
            sql: |-
              CREATE USER AGENT_TOOLS IDENTIFIED BY "${db_password}"
                DEFAULT TABLESPACE DATA
                QUOTA UNLIMITED ON DATA
        - sql:
            sql: |-
              GRANT CREATE SESSION, CREATE PROCEDURE, CREATE TABLE,
                    CREATE TYPE TO AGENT_TOOLS

  - changeSet:
      id: 001-create-agent-factory-user-adb
      author: paf-poc
      context: adb
      changes:
        - sql:
            sql: |-
              CREATE USER AGENT_FACTORY IDENTIFIED BY "${db_password}"
                DEFAULT TABLESPACE DATA
                QUOTA UNLIMITED ON DATA
        - sql:
            sql: |-
              GRANT CREATE SESSION, CREATE TABLE, CREATE VIEW, CREATE SEQUENCE,
                    CREATE PROCEDURE, CREATE TRIGGER, CREATE TYPE TO AGENT_FACTORY

  - changeSet:
      id: 002-grant-agent-factory-paf-adb
      author: paf-poc
      context: adb
      # CREATE DATABASE LINK is absent: Autonomous Database creates links
      # through DBMS_CLOUD_ADMIN.CREATE_DATABASE_LINK, and the privilege is not
      # grantable. PAF does not use a database link in this PoC.
      changes:
        - sql:
            sql: |-
              GRANT CONNECT, RESOURCE,
                    CREATE SYNONYM,
                    CREATE ANY INDEX, INSERT ANY TABLE
                TO AGENT_FACTORY
        - sql:
            sql: |-
              GRANT READ, WRITE ON DIRECTORY DATA_PUMP_DIR TO AGENT_FACTORY

  - changeSet:
      id: 003-grant-agent-factory-readonly-user-mgmt
      author: paf-poc
      # PAF's UI installer (step 3) creates a separate read-only DB user
      # owned by AGENT_FACTORY. Without these grants the step fails with
      # `ORA-01031: insufficient privileges`. These three grants are
      # taken from the kit's quickstart startup.sh, and are grantable on
      # both targets.
      changes:
        - sql:
            sql: |-
              GRANT CREATE USER TO AGENT_FACTORY
        - sql:
            sql: |-
              GRANT DROP USER TO AGENT_FACTORY
        - sql:
            sql: |-
              GRANT CREATE SESSION TO AGENT_FACTORY WITH ADMIN OPTION
