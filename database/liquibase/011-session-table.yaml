databaseChangeLog:
  # BANK_CORE.auth_session — opaque session-token table. The trust boundary between
  # untrusted user input (chat messages, etc.) and the authoritative
  # (customer_id, application_id) the workflow acts on. Named `auth_session`
  # rather than `session` because SESSION is an Oracle reserved word in DDL
  # contexts (ORA-00903 on CREATE TABLE BANK_CORE.session).
  #
  # Why it exists:
  # PAF's flow inputs are limited to the Chat input message; an operator
  # cannot pass structured fields at flow start (see issues/no-flow-start-inputs.md).
  # Extracting IDs from the chat message is unacceptable — any user could
  # type customer_id=4 application_id=3 and impersonate another customer
  # (IDOR / OWASP API1). Instead, login mints an opaque session token row
  # here; the token is what crosses the untrusted boundary (hardcoded in a
  # PAF Text Input node for POC; minted by the App Service in production).
  # The banking-mcp wrapper validates the token against this table and
  # returns the joined application context using cx_Oracle bind variables.
  #
  # Fail-secure: an invalid or expired token returns zero rows; the agent's
  # no-row guard then fires and emits "application not found". There is no
  # "first matching row" fallback.

  - changeSet:
      id: 011-create-session
      author: paf-poc
      changes:
        - sql:
            sql: |-
              CREATE TABLE BANK_CORE.auth_session (
                session_token   VARCHAR2(64) PRIMARY KEY,
                customer_id     NUMBER NOT NULL
                  REFERENCES BANK_CORE.customer(customer_id),
                application_id  NUMBER NOT NULL
                  REFERENCES BANK_CORE.loan_application(application_id),
                scenario_label  VARCHAR2(60),
                created_at      TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
                expires_at      TIMESTAMP
              )
        - sql:
            sql: |-
              CREATE INDEX BANK_CORE.ix_auth_session_customer
                ON BANK_CORE.auth_session(customer_id, application_id)

  - changeSet:
      id: 011-grant-session-readonly-to-reporting
      author: paf-poc
      changes:
        - sql:
            sql: |-
              GRANT SELECT ON BANK_CORE.auth_session TO BANK_VIEWS

  # Seed test tokens — one per CHAT_WORKFLOW scenario, plus a mismatch
  # case for the no-row guard test. Tokens are deterministic + readable
  # for POC ergonomics (operator pastes the token from the test-prompts
  # table in paf/flows/CHAT_WORKFLOW.md into the PAF canvas Text Input).
  # In production these are opaque random strings minted at login.
  #
  # customer_id / application_id are resolved by customer name joined to
  # their loan_application, not hardcoded: BANK_CORE.customer and
  # BANK_CORE.loan_application use IDENTITY columns whose values are non-
  # contiguous (a rolled-back insert still consumes a number), so the
  # surrogate keys cannot be assumed. Each scenario customer owns exactly
  # one application.
  - changeSet:
      id: 011-seed-test-sessions
      author: paf-poc
      changes:
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.auth_session (session_token, customer_id, application_id, scenario_label)
              SELECT 'paf-test-alice-1', la.customer_id, la.application_id, 'Alice — clean APPROVE'
                FROM BANK_CORE.loan_application la
                JOIN BANK_CORE.customer c ON c.customer_id = la.customer_id
               WHERE c.full_name = 'Alice Salaried'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.auth_session (session_token, customer_id, application_id, scenario_label)
              SELECT 'paf-test-david-3', la.customer_id, la.application_id, 'David — DTI hard cap → DECLINE'
                FROM BANK_CORE.loan_application la
                JOIN BANK_CORE.customer c ON c.customer_id = la.customer_id
               WHERE c.full_name = 'David HighDti'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.auth_session (session_token, customer_id, application_id, scenario_label)
              SELECT 'paf-test-eva-4', la.customer_id, la.application_id, 'Eva — score below floor → DECLINE'
                FROM BANK_CORE.loan_application la
                JOIN BANK_CORE.customer c ON c.customer_id = la.customer_id
               WHERE c.full_name = 'Eva LowScore'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.auth_session (session_token, customer_id, application_id, scenario_label)
              SELECT 'paf-test-frank-5', la.customer_id, la.application_id, 'Frank — mid-band → REVIEW'
                FROM BANK_CORE.loan_application la
                JOIN BANK_CORE.customer c ON c.customer_id = la.customer_id
               WHERE c.full_name = 'Frank MidBand'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.auth_session (session_token, customer_id, application_id, scenario_label)
              SELECT 'paf-test-jane-9', la.customer_id, la.application_id, 'Jane — unknown employer → DECLINE'
                FROM BANK_CORE.loan_application la
                JOIN BANK_CORE.customer c ON c.customer_id = la.customer_id
               WHERE c.full_name = 'Jane UnknownEmployer'
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.auth_session (session_token, customer_id, application_id, scenario_label)
              SELECT 'paf-test-kyle-10', la.customer_id, la.application_id, 'Kyle — dormant employer → REVIEW'
                FROM BANK_CORE.loan_application la
                JOIN BANK_CORE.customer c ON c.customer_id = la.customer_id
               WHERE c.full_name = 'Kyle DormantEmployer'
        # Valid session for Alice, but pointing at an application that
        # belongs to a different customer (Bob) — exercises the cross-
        # customer guard, which must reject even though the token is valid.
        - sql:
            sql: |-
              INSERT INTO BANK_CORE.auth_session (session_token, customer_id, application_id, scenario_label)
              SELECT 'paf-test-mismatch', alice.customer_id, bob_app.application_id,
                     'Mismatch — valid session, app belongs to another customer'
                FROM BANK_CORE.customer alice
                JOIN BANK_CORE.loan_application bob_app
                  ON bob_app.customer_id = (SELECT customer_id FROM BANK_CORE.customer WHERE full_name = 'Bob Selfemployed')
               WHERE alice.full_name = 'Alice Salaried'

  # Token slugs carry the scenario meaning (customer name + profile) and are
  # decoupled from surrogate IDs, so they stay accurate regardless of how the
  # IDENTITY sequences land on a rebuild. Applied as a dedicated changeset
  # rather than edited into 011-seed-test-sessions because applied changesets
  # are checksum-locked. The token strings are what the operator pastes into
  # the PAF canvas Text Input; keep them in sync with the test-prompts table
  # in paf/flows/CHAT_WORKFLOW.md.
  - changeSet:
      id: 011-rename-test-session-tokens
      author: paf-poc
      changes:
        - sql:
            sql: |-
              UPDATE BANK_CORE.auth_session SET session_token = 'paf-test-alice-salaried'
               WHERE session_token = 'paf-test-alice-1'
        - sql:
            sql: |-
              UPDATE BANK_CORE.auth_session SET session_token = 'paf-test-david-highdti'
               WHERE session_token = 'paf-test-david-3'
        - sql:
            sql: |-
              UPDATE BANK_CORE.auth_session SET session_token = 'paf-test-eva-lowscore'
               WHERE session_token = 'paf-test-eva-4'
        - sql:
            sql: |-
              UPDATE BANK_CORE.auth_session SET session_token = 'paf-test-frank-midband'
               WHERE session_token = 'paf-test-frank-5'
        - sql:
            sql: |-
              UPDATE BANK_CORE.auth_session SET session_token = 'paf-test-jane-unknownemployer'
               WHERE session_token = 'paf-test-jane-9'
        - sql:
            sql: |-
              UPDATE BANK_CORE.auth_session SET session_token = 'paf-test-kyle-dormantemployer'
               WHERE session_token = 'paf-test-kyle-10'
