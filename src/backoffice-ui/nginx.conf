server {
    listen 80;
    server_name _;

    # Relative redirects only — we sit behind the proxy on a published port, and
    # an absolute redirect would rebuild the Location from the Host without the
    # public :5173 port, bouncing the browser to the wrong port.
    absolute_redirect off;

    # Served behind the proxy front door under the /backoffice prefix. The bundle
    # is built with Vite base=/backoffice/, so assets come in as /backoffice/...;
    # alias maps that prefix onto the static root, and unknown paths fall back to
    # the SPA entry for client-side routing (e.g. /backoffice/history).
    location = /backoffice {
        return 301 /backoffice/;
    }

    location /backoffice/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /backoffice/index.html;
    }
}
