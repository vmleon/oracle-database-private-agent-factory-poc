server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pure static SPA serving. /v1 routing and the public port live in the proxy
    # front door (deploy/podman/Caddyfile); this container is served at / by it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
