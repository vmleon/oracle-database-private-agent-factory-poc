server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API + SSE — same-origin proxy to the application-backend container,
    # so the browser never makes a cross-origin request (no CORS) and the chat
    # SSE stream flows through nginx.
    location /v1/ {
        proxy_pass http://application-backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # SSE: a chat turn can sit silent for minutes between connect and the
        # pushed reply, so don't buffer and use a generous read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA client-side routing: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
