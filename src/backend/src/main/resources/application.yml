server:
  port: 8090

spring:
  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:ORCLPDB1}
    username: ${DB_USER:SVC_BACKEND}
    password: ${DB_PASSWORD}
    type: oracle.ucp.jdbc.PoolDataSource
    oracleucp:
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
      connection-pool-name: appPool
      initial-pool-size: 2
      min-pool-size: 2
      max-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      # Map java.time.Instant to a plain TIMESTAMP read/write. The Hibernate 6
      # default (TIMESTAMP_UTC) makes the Oracle driver read our TIMESTAMP
      # columns as time-zone-aware values, which throws ORA-18716 ("not in any
      # time zone") on Oracle. AUTH_SESSION/CHAT_MESSAGE columns are plain TIMESTAMP.
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP

paf:
  base-url: ${PAF_BASE_URL:https://paf:8080}
  api-key: ${PAF_API_KEY:}
  agent-id: ${PAF_AGENT_ID:}

session:
  ttl-hours: ${SESSION_TTL_HOURS:8}

management:
  endpoints:
    web:
      exposure:
        include: health
