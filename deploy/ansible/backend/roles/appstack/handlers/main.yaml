---
- name: Restart the backend
  ansible.builtin.systemd:
    name: paf-poc-backend
    state: restarted
    daemon_reload: true

- name: Restart OPA
  ansible.builtin.systemd:
    name: paf-poc-opa
    state: restarted
    daemon_reload: true

- name: Restart the registry
  ansible.builtin.systemd:
    name: paf-poc-registry
    state: restarted
    daemon_reload: true

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload

- name: Restart the MCP wrappers
  ansible.builtin.systemd:
    name: "paf-poc-{{ item.name }}"
    state: restarted
    daemon_reload: true
  loop: "{{ mcp_services }}"
  loop_control:
    label: "{{ item.name }}"
