---
app_dir: /opt/paf-poc
wallet_dir: /opt/paf-poc/wallet
opa_version: "1.0.0"
opa_url: "https://openpolicyagent.org/downloads/v{{ opa_version }}/opa_linux_amd64_static"

# The four MCP wrappers, on the ports the flow's server URLs use. banking reads
# through REPORTING (SELECT-only on the views); the two that write go through
# AGENT_FACTORY, which owns the AGENT_TOOLS grants.
mcp_services:
  - { name: opa-mcp, port: 8500 }
  - { name: hitl-mcp, port: 8502, db_user: AGENT_FACTORY }
  - { name: banking-mcp, port: 8503, db_user: REPORTING }
  - { name: application-mcp, port: 8504, db_user: AGENT_FACTORY }
