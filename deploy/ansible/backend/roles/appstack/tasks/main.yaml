---
- name: Install the application runtime
  ansible.builtin.dnf:
    name:
      - java-21-openjdk-headless
      # Oracle Linux 9 defaults to Python 3.9, which cannot evaluate the
      # `str | None` annotations the registry's models use (PEP 604).
      - python3.11
      - python3.11-pip
      - unzip
    state: present

- name: Create the application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ app_dir }}"
    - "{{ wallet_dir }}"
    - "{{ app_dir }}/registry"
    - "{{ app_dir }}/opa"

- name: Fetch the ADB wallet
  ansible.builtin.get_url:
    url: "{{ adb_wallet_par_url }}"
    dest: /tmp/adb-wallet.b64
    mode: "0600"
    timeout: 60

# The bucket object holds base64 text rather than the zip: the upload has to be
# deferred past plan time, because the wallet does not exist until the database
# it comes from is created. See deploy/tf/app/adb.tf.
# GNU coreutils base64 writes to stdout and has no -o, so this redirects.
- name: Decode the wallet
  ansible.builtin.shell: base64 -d /tmp/adb-wallet.b64 > /tmp/adb-wallet.zip
  args:
    creates: /tmp/adb-wallet.zip

- name: Unpack the wallet
  ansible.builtin.unarchive:
    src: /tmp/adb-wallet.zip
    dest: "{{ wallet_dir }}"
    remote_src: true
    mode: "0600"

- name: Remove the wallet archives
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/adb-wallet.b64
    - /tmp/adb-wallet.zip

- name: Deploy the Spring Boot jar
  ansible.builtin.copy:
    src: app.jar
    dest: "{{ app_dir }}/app.jar"
    mode: "0640"
  notify: Restart the backend

- name: Deploy the OPA policy bundle
  ansible.builtin.copy:
    src: opa/
    dest: "{{ app_dir }}/opa/"
    mode: "0640"
  notify: Restart OPA

- name: Deploy the company registry service
  ansible.builtin.copy:
    src: registry/
    dest: "{{ app_dir }}/registry/"
    mode: "0640"
  notify: Restart the registry

- name: Discard a virtualenv built with the wrong interpreter
  ansible.builtin.file:
    path: "{{ app_dir }}/registry/venv"
    state: absent
  when: not (app_dir + "/registry/venv/bin/python3.11") is exists

- name: Create the registry virtualenv
  ansible.builtin.command: /usr/bin/python3.11 -m venv {{ app_dir }}/registry/venv
  args:
    creates: "{{ app_dir }}/registry/venv/bin/python3.11"

# `executable` points pip straight at the virtualenv, so the pip module never
# looks for a `virtualenv` binary that Oracle Linux does not ship.
- name: Install the registry dependencies
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/registry/requirements.txt"
    executable: "{{ app_dir }}/registry/venv/bin/pip"

- name: Deploy the MCP wrappers
  ansible.builtin.copy:
    src: "mcp/{{ item.name }}/"
    dest: "{{ app_dir }}/mcp/{{ item.name }}/"
    mode: "0640"
  loop: "{{ mcp_services }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart the MCP wrappers

- name: Create each wrapper's virtualenv
  ansible.builtin.command: /usr/bin/python3.11 -m venv {{ app_dir }}/mcp/{{ item.name }}/venv
  args:
    creates: "{{ app_dir }}/mcp/{{ item.name }}/venv/bin/python3.11"
  loop: "{{ mcp_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install each wrapper's dependencies
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/mcp/{{ item.name }}/requirements.txt"
    executable: "{{ app_dir }}/mcp/{{ item.name }}/venv/bin/pip"
  loop: "{{ mcp_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Render the MCP service units
  ansible.builtin.template:
    src: mcp.service.j2
    dest: "/etc/systemd/system/paf-poc-{{ item.name }}.service"
    mode: "0644"
  loop: "{{ mcp_services }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart the MCP wrappers

- name: Enable the MCP wrappers
  ansible.builtin.systemd:
    name: "paf-poc-{{ item.name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ mcp_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install the OPA binary
  ansible.builtin.get_url:
    url: "{{ opa_url }}"
    dest: /usr/local/bin/opa
    mode: "0755"
    timeout: 120

- name: Create the integration key file
  ansible.builtin.copy:
    content: ""
    dest: /etc/paf-poc-backend.env
    mode: "0600"
    force: false

- name: Render the service units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: backend.service.j2, dest: paf-poc-backend.service }
    - { src: opa.service.j2, dest: paf-poc-opa.service }
    - { src: registry.service.j2, dest: paf-poc-registry.service }
  notify:
    - Restart the backend
    - Restart OPA
    - Restart the registry

- name: Enable the services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - paf-poc-opa
    - paf-poc-registry
    - paf-poc-backend

# Oracle Linux images boot with firewalld active and only ssh allowed, so a
# service can be listening on 0.0.0.0 and still be unreachable from the load
# balancer or its sibling tiers.
- name: Open the tier's ports
  ansible.builtin.command: firewall-cmd --permanent --add-port={{ item }}/tcp
  loop: [8090, 8600, 8503, 8504, 8505]
  changed_when: true
  notify: Reload firewalld
