---
- name: Install the container runtime
  ansible.builtin.dnf:
    name:
      - podman
      - unzip
      - tar
    state: present

# A larger boot volume does not reach the filesystem on its own.
- name: Expand the root filesystem into the boot volume
  ansible.builtin.command: /usr/libexec/oci-growfs -y
  changed_when: false
  failed_when: false

- name: Create the PAF directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ paf_dir }}"
    - "{{ wallet_dir }}"
    - "{{ kit_dir }}"

- name: Fetch the ADB wallet
  ansible.builtin.get_url:
    url: "{{ adb_wallet_par_url }}"
    dest: /tmp/adb-wallet.b64
    mode: "0600"
    timeout: 60

# The bucket object holds base64 text rather than the zip: the upload has to be
# deferred past plan time, because the wallet does not exist until the database
# it comes from is created. See deploy/tf/app/adb.tf.
# GNU coreutils base64 writes to stdout and has no -o, so this redirects.
- name: Decode the wallet
  ansible.builtin.shell: base64 -d /tmp/adb-wallet.b64 > /tmp/adb-wallet.zip
  args:
    creates: /tmp/adb-wallet.zip

- name: Unpack the wallet
  ansible.builtin.unarchive:
    src: /tmp/adb-wallet.zip
    dest: "{{ wallet_dir }}"
    remote_src: true
    mode: "0600"

- name: Remove the wallet archives
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/adb-wallet.b64
    - /tmp/adb-wallet.zip

# The kit tarball is far larger than a role artifact, so it travels as its own
# bucket object behind its own read-only pre-authenticated request.
- name: Fetch the PAF kit tarball
  ansible.builtin.get_url:
    url: "{{ paf_tarball_par_url }}"
    dest: /tmp/paf-kit.tar.gz
    mode: "0600"
    timeout: 1800

- name: Unpack the PAF kit
  ansible.builtin.unarchive:
    src: /tmp/paf-kit.tar.gz
    dest: "{{ kit_dir }}"
    remote_src: true
    creates: "{{ kit_dir }}/build-image.sh"

# 2.3 GB of no further use once unpacked, on a disk that also holds the
# unpacked tree and every layer of the image built from it.
- name: Remove the kit tarball
  ansible.builtin.file:
    path: /tmp/paf-kit.tar.gz
    state: absent

- name: Read the kit version
  ansible.builtin.slurp:
    src: "{{ kit_dir }}/applied-ai/kit/agent_factory/internal/version.json"
  register: paf_version_file

- name: Resolve the image tag
  ansible.builtin.set_fact:
    paf_app_version: "{{ (paf_version_file.content | b64decode | from_json).app_version }}"

# podman's storage is keyed by image ID, not by tag, so a `creates:` path built
# from the version never matches and the image is rebuilt on every retry — ten
# minutes each time. Ask podman instead.
- name: Check whether the PAF image is already built
  ansible.builtin.command: podman image exists localhost/applied-ai-label:{{ paf_app_version }}
  register: paf_image
  failed_when: false
  changed_when: false

- name: Build the PAF image
  ansible.builtin.command:
    cmd: ./build-image.sh aai
    chdir: "{{ kit_dir }}"
  when: paf_image.rc != 0

- name: Render the PAF service unit
  ansible.builtin.template:
    src: paf.service.j2
    dest: /etc/systemd/system/paf.service
    mode: "0644"
  notify: Restart PAF

- name: Enable PAF
  ansible.builtin.systemd:
    name: paf
    enabled: true
    state: started
    daemon_reload: true

# The post-start handshake the kit's own deploy.sh performs. Without the marker,
# startup.sh polls for it and the container exits after ~2 minutes; without the
# seeded version.json, db_migrate.py fails during the UI installer.
- name: Write the config-complete marker
  ansible.builtin.file:
    path: "{{ kit_dir }}/applied-ai/volume/.config_complete.marker"
    state: touch
    mode: "0644"

- name: Wait for the container to accept commands
  ansible.builtin.command: podman exec paf true
  register: paf_exec
  retries: 30
  delay: 5
  until: paf_exec.rc == 0
  changed_when: false

- name: Start crond inside the container
  ansible.builtin.command: podman exec paf crond start
  changed_when: false
  failed_when: false

- name: Seed the version file the installer reads
  ansible.builtin.command: >-
    podman exec paf sh -c
    "mkdir -p /mount/data/app/latest/version &&
     cp -f /home/aaiuser/install/agent_factory/internal/version.json
     /mount/data/app/latest/version/version.json"
  changed_when: false

# Oracle Linux images boot with firewalld active and only ssh allowed, so a
# service can be listening on 0.0.0.0 and still be unreachable from the load
# balancer or its sibling tiers.
- name: Open the tier's ports
  ansible.builtin.command: firewall-cmd --permanent --add-port={{ item }}/tcp
  loop: [8080]
  changed_when: true
  notify: Reload firewalld
