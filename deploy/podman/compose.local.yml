services:
  oracle-free-26ai:
    image: container-registry.oracle.com/database/free:latest
    container_name: paf-oracle-free-26ai
    restart: unless-stopped
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: "${DB_PASSWORD}"
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oradata:/opt/oracle/oradata
      - ./init-scripts:/opt/oracle/scripts/startup:ro
    # Select AI (DBMS_CLOUD_AI) is not wired locally — it needs an HTTPS
    # endpoint in front of vLLM and is the cloud/ADB path. See LOCAL.md.
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 360s

  paf:
    # Image is built locally from the kit tarball; see `manage.py paf build`.
    # If you change PAF_APP_VERSION in .env you must rebuild the image.
    image: "localhost/applied-ai-label:${PAF_APP_VERSION}"
    container_name: paf-agent-factory
    user: "0:0"
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: "/home/aaiuser/install/startup.sh"
    stop_grace_period: 30s
    depends_on:
      oracle-free-26ai:
        condition: service_healthy
    volumes:
      - ../../paf-kit/applied-ai/dev-shared:/dev-shared
      - ../../paf-kit/applied-ai/volume:/mount
    # PAF can't do mDNS / Bonjour, so when VLLM_HOST is a .local name we
    # resolve it on the host (which does mDNS) at `local up` and inject the
    # mapping here. Falls back to a no-op loopback entry when not needed.
    extra_hosts:
      - "${VLLM_HOSTS_ENTRY:-localhost:127.0.0.1}"
    environment:
      IS_UPGRADE: "false"
      HOST_OS: "${HOST_OS:-Darwin}"
      PYTHONPATH: "/home/aaiuser/install"
      TAKE_SNAPSHOT: "false"
      USE_WALLET: "false"
      INCLUDE_KA_DATA: "false"

  # Open Policy Agent — runs in server mode loading every .rego file
  # in ./packages. PAF reaches it via the OPA MCP server (below); no
  # host port is published, only the compose network reaches it.
  opa:
    image: docker.io/openpolicyagent/opa:latest
    container_name: paf-opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "--log-level=info"
      - "/packages"
    volumes:
      - ../../opa/packages:/packages:ro

  # MCP wrapper around OPA — exposes each Rego rule as a typed MCP
  # tool over streamable-http. PAF's MCP Server node connects to
  # http://opa-mcp:8500/mcp/. Wired to CHAT_WORKFLOW only per the
  # two-agent security model.
  opa-mcp:
    build:
      context: ../../src/ai/opa-mcp
    container_name: paf-opa-mcp
    restart: unless-stopped
    depends_on:
      opa:
        condition: service_started
    environment:
      OPA_URL: "http://opa:8181"
      PORT: "8500"

  # HITL MCP — exposes the in-DB AGENT_TOOLS.PKG_AGENT_TOOLS.create_hitl_task
  # PL/SQL function as an MCP tool. PAF's SQL Query node is read-only by
  # design, so anything with side effects (insert + enqueue) has to go
  # through MCP/REST per docs/PAF.md §10. Connects to Oracle as
  # AGENT_FACTORY (granted EXECUTE on the package in changeset 007).
  # PAF reaches it at http://hitl-mcp:8502/mcp/. Wired to CHAT_WORKFLOW only.
  hitl-mcp:
    build:
      context: ../../src/ai/hitl-mcp
    container_name: paf-hitl-mcp
    restart: unless-stopped
    depends_on:
      oracle-free-26ai:
        condition: service_healthy
    environment:
      PORT: "8502"
      DB_HOST: "oracle-free-26ai"
      DB_PORT: "1521"
      DB_SERVICE: "FREEPDB1"
      DB_USER: "AGENT_FACTORY"
      DB_PASSWORD: "${DB_PASSWORD}"

  # Application MCP — write surface for conversational loan intake.
  # Exposes upsert_draft_application as an MCP tool so the Concierge agent
  # can create/patch a customer's DRAFT loan application as it collects
  # loan details. Connects to Oracle as AGENT_FACTORY (same as hitl-mcp).
  # PAF reaches it at http://application-mcp:8504/mcp/.
  application-mcp:
    build:
      context: ../../src/ai/application-mcp
    container_name: paf-application-mcp
    restart: unless-stopped
    depends_on:
      oracle-free-26ai:
        condition: service_healthy
    environment:
      PORT: "8504"
      DB_HOST: "oracle-free-26ai"
      DB_PORT: "1521"
      DB_SERVICE: "FREEPDB1"
      DB_USER: "AGENT_FACTORY"
      DB_PASSWORD: "${DB_PASSWORD}"
      BACKEND_URL: "http://application-backend:8090"

  # Banking MCP — opaque-session lookup. Resolves a token (set by login,
  # held by the operator in a PAF Text Input node for POC) to the customer's
  # current loan-application context, using cx_Oracle bind variables. This
  # is CHAT_WORKFLOW's trust boundary: the token is the only thing that
  # crosses from untrusted input to the authoritative (customer_id,
  # application_id) the workflow acts on. Connects as REPORTING (same user
  # as the existing Banking Application DB datasource); REPORTING is granted
  # SELECT on APP.session by Liquibase changeset 011. PAF reaches it at
  # http://banking-mcp:8503/mcp/. Wired to CHAT_WORKFLOW only.
  banking-mcp:
    build:
      context: ../../src/ai/banking-mcp
    container_name: paf-banking-mcp
    restart: unless-stopped
    depends_on:
      oracle-free-26ai:
        condition: service_healthy
    environment:
      PORT: "8503"
      DB_HOST: "oracle-free-26ai"
      DB_PORT: "1521"
      DB_SERVICE: "FREEPDB1"
      DB_USER: "REPORTING"
      DB_PASSWORD: "${DB_PASSWORD}"
      BACKEND_URL: "http://application-backend:8090"
      OPA_URL: "http://opa:8181"
      REGISTRY_URL: "http://registry-api:8600"

  # Synthetic Company Registry — FastAPI service with JSON-backed data,
  # OpenAPI 3.1 spec at /openapi.json. Registered with PAF as an HTTP
  # datasource for CHAT_WORKFLOW (the third PAF datasource type, alongside
  # Database and File). No host port published — only the compose
  # network reaches it as http://registry-api:8600.
  registry-api:
    build:
      context: ../../src/api/registry
    container_name: paf-registry-api
    restart: unless-stopped

  # Spring Boot Application Service — the customer chat slice. Mints session
  # tokens, persists chat_message, and bridges customer turns to PAF's
  # CHAT_WORKFLOW via an agent-scoped API key (PAF_AGENT_ID / PAF_API_KEY)
  # against PAF's integration run endpoint. Connects to Oracle as APP (owns
  # auth_session + chat_message). Reaches PAF on the compose network at
  # https://paf:8080 (self-signed cert; the client skips TLS verification).
  application-backend:
    build:
      context: ../../src/backend
    container_name: application-backend
    restart: unless-stopped
    depends_on:
      oracle-free-26ai:
        condition: service_healthy
      paf:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      DB_HOST: "oracle-free-26ai"
      DB_PORT: "1521"
      DB_SERVICE: "FREEPDB1"
      DB_USER: "APP"
      DB_PASSWORD: "${DB_PASSWORD}"
      PAF_BASE_URL: "https://paf:8080"
      PAF_AGENT_ID: "${PAF_AGENT_ID:-}"
      PAF_API_KEY: "${PAF_API_KEY:-}"

  # Customer chat SPA (React/Vite, nginx static). Internal-only — the proxy
  # front door publishes the public port and routes / here.
  customer-ui:
    build:
      context: ../../src/customer-ui
    container_name: customer-ui
    restart: unless-stopped
    depends_on:
      - application-backend

  # Backoffice reviewer SPA (React/Vite, nginx static, built with base
  # /backoffice/). Internal-only — the proxy routes /backoffice here.
  backoffice-ui:
    build:
      context: ../../src/backoffice-ui
    container_name: backoffice-ui
    restart: unless-stopped
    depends_on:
      - application-backend

  # Single front door for the browser-facing surface. Routes / -> customer-ui,
  # /backoffice -> backoffice-ui, /v1 -> application-backend, re-resolving each
  # container name per request so a backend restart never 502s. See Caddyfile.
  proxy:
    image: docker.io/library/caddy:2-alpine
    container_name: paf-proxy
    restart: unless-stopped
    depends_on:
      - customer-ui
      - backoffice-ui
      - application-backend
    ports:
      - "5173:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  # TLS gateway for the MCP servers. PAF requires https:// MCP URLs, so this
  # terminates TLS (self-signed cert, SAN=mcp-proxy) on :8443 and reverse-proxies
  # each path prefix to the plain-HTTP MCP app (/banking/mcp/ -> banking-mcp:8503/mcp/).
  # PAF reaches it over the compose network and trusts the certificate through its
  # administrator certificate store (manage.py paf trust-ca). Cert built by
  # `manage.py local mcp-tls` (also run by `local up`).
  mcp-proxy:
    image: docker.io/library/caddy:2-alpine
    container_name: paf-mcp-proxy
    restart: unless-stopped
    depends_on:
      - banking-mcp
      - opa-mcp
      - hitl-mcp
      - application-mcp
    volumes:
      - ./Caddyfile.mcp:/etc/caddy/Caddyfile:ro
      - ../../mcp-tls/mcp-proxy.crt:/etc/caddy/certs/mcp-proxy.crt:ro
      - ../../mcp-tls/mcp-proxy.key:/etc/caddy/certs/mcp-proxy.key:ro

volumes:
  oradata:
    name: paf-oradata
