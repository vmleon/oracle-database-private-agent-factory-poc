services:
  oracle-free-26ai:
    image: container-registry.oracle.com/database/free:latest
    container_name: paf-oracle-free-26ai
    restart: unless-stopped
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: "${DB_PASSWORD}"
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oradata:/opt/oracle/oradata
      - ./init-scripts:/opt/oracle/scripts/startup:ro
    # Oracle DBMS_CLOUD_AI (Select AI) talks to the caddy-ollama-tls
    # service over compose's internal DNS — no extra_hosts needed here.
    # The TLS terminator that resolves the real Ollama upstream is the
    # Caddy service below.
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 360s

  paf:
    # Image is built locally from the kit tarball; see `manage.py paf build`.
    # If you change PAF_APP_VERSION in .env you must rebuild the image.
    image: "localhost/applied-ai-label:${PAF_APP_VERSION}"
    container_name: paf-agent-factory
    user: "0:0"
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: "/home/aaiuser/install/startup.sh"
    stop_grace_period: 30s
    depends_on:
      oracle-free-26ai:
        condition: service_healthy
    volumes:
      - ../../paf-kit/applied-ai/dev-shared:/dev-shared
      - ../../paf-kit/applied-ai/volume:/mount
    # PAF can't do mDNS / Bonjour, so when OLLAMA_HOST is a .local name we
    # resolve it on the host (which does mDNS) at `local up` and inject the
    # mapping here. Falls back to a no-op loopback entry when not needed.
    extra_hosts:
      - "${OLLAMA_HOSTS_ENTRY:-localhost:127.0.0.1}"
    environment:
      IS_UPGRADE: "false"
      HOST_OS: "${HOST_OS:-Darwin}"
      PYTHONPATH: "/home/aaiuser/install"
      TAKE_SNAPSHOT: "false"
      USE_WALLET: "false"
      INCLUDE_KA_DATA: "false"

  # Open Policy Agent — runs in server mode loading every .rego file
  # in ./packages. PAF reaches it via the OPA MCP server (below); no
  # host port is published, only the compose network reaches it.
  opa:
    image: docker.io/openpolicyagent/opa:latest
    container_name: paf-opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "--log-level=info"
      - "/packages"
    volumes:
      - ../../opa/packages:/packages:ro

  # MCP wrapper around OPA — exposes each Rego rule as a typed MCP
  # tool over streamable-http. PAF's MCP Server node connects to
  # http://opa-mcp:8500/mcp/. Wired to CHAT_AGENT only per the
  # two-agent security model.
  opa-mcp:
    build:
      context: ../../src/ai/opa-mcp
    container_name: paf-opa-mcp
    restart: unless-stopped
    depends_on:
      opa:
        condition: service_started
    environment:
      OPA_URL: "http://opa:8181"
      PORT: "8500"

  # HITL MCP — exposes the in-DB AGENT_TOOLS.PKG_AGENT_TOOLS.create_hitl_task
  # PL/SQL function as an MCP tool. PAF's SQL Query node is read-only by
  # design, so anything with side effects (insert + enqueue) has to go
  # through MCP/REST per docs/PAF.md §10. Connects to Oracle as
  # AGENT_FACTORY (granted EXECUTE on the package in changeset 007).
  # PAF reaches it at http://hitl-mcp:8502/mcp/. Wired to CHAT_AGENT only.
  hitl-mcp:
    build:
      context: ../../src/ai/hitl-mcp
    container_name: paf-hitl-mcp
    restart: unless-stopped
    depends_on:
      oracle-free-26ai:
        condition: service_healthy
    environment:
      PORT: "8502"
      DB_HOST: "oracle-free-26ai"
      DB_PORT: "1521"
      DB_SERVICE: "FREEPDB1"
      DB_USER: "AGENT_FACTORY"
      DB_PASSWORD: "${DB_PASSWORD}"

  # STUB OCR MCP — placeholder for the YOLO + PaddleOCR/Tesseract pipeline.
  # Exposes a single `extract_document` MCP tool whose canned responses are
  # keyed on filename, aligned with the documents seeded by
  # 010-seed-synthetic.yaml so the test-bench scenarios resolve end-to-end
  # without a real ML stack. PAF reaches it at http://ocr-mcp:8501/mcp/.
  # Wired to CHAT_AGENT only per the two-agent security model.
  ocr-mcp:
    build:
      context: ../../src/ai/ocr-mcp
    container_name: paf-ocr-mcp
    restart: unless-stopped
    environment:
      PORT: "8501"

  # Synthetic Company Registry — FastAPI service with JSON-backed data,
  # OpenAPI 3.1 spec at /openapi.json. Registered with PAF as an HTTP
  # datasource for CHAT_AGENT (the third PAF datasource type, alongside
  # Database and File). No host port published — only the compose
  # network reaches it as http://registry-api:8600.
  registry-api:
    build:
      context: ../../src/api/registry
    container_name: paf-registry-api
    restart: unless-stopped

  # TLS terminator in front of Ollama. Exists because Oracle 26ai's
  # DBMS_CLOUD_AI rejects HTTP endpoints on-prem (ORA-20047). Caddy
  # serves a pre-generated self-signed cert; the matching CA root is
  # baked into the Oracle container's OS trust store by `manage.py local up`.
  #
  # No host port is published — only the compose network reaches it.
  # The upstream (real Ollama on a LAN GPU host or laptop) is resolved
  # via extra_hosts (same mDNS trick PAF uses).
  caddy-ollama-tls:
    image: docker.io/caddy:2-alpine
    container_name: paf-caddy-ollama-tls
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/tls:/etc/caddy/tls:ro
    environment:
      OLLAMA_HOST: "${OLLAMA_HOST}"
      OLLAMA_PORT: "${OLLAMA_PORT:-11434}"
    extra_hosts:
      - "${OLLAMA_HOSTS_ENTRY:-localhost:127.0.0.1}"

volumes:
  oradata:
    name: paf-oradata
